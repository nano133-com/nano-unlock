name: Release

# On a v* tag: test, build nano-unlock.zip from the plugin folder only, and attach it to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2
          coverage: none

      - name: Install the dev tools
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Coding standards
        run: vendor/bin/phpcs -q

      - name: The tag matches the plugin's version everywhere
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: *//p' nano-unlock/nano-unlock.php | tr -d '[:space:]')
          constant=$(sed -n "s/^define( 'NANO_UNLOCK_VERSION', '\(.*\)' );$/\1/p" nano-unlock/nano-unlock.php)
          stable=$(sed -n 's/^Stable tag: *//p' nano-unlock/readme.txt | tr -d '[:space:]')
          asset=$(sed -n "s/.*'version' *=> *'\(.*\)',.*/\1/p" nano-unlock/blocks/paywall/index.asset.php)
          fail=0
          for pair in "header:$header" "NANO_UNLOCK_VERSION:$constant" "readme.txt Stable tag:$stable" "index.asset.php:$asset"; do
            if [ "${pair##*:}" != "$tag" ]; then echo "The tag is $GITHUB_REF_NAME but ${pair%:*} says ${pair##*:}" >&2; fail=1; fi
          done
          if ! grep -qx "= $tag =" nano-unlock/readme.txt; then echo "readme.txt has no changelog entry \"= $tag =\"" >&2; fail=1; fi
          exit $fail

      - name: Build nano-unlock.zip
        run: |
          zip -qr nano-unlock.zip nano-unlock -x '*.DS_Store'
          unzip -l nano-unlock.zip
          # Only the plugin folder: every entry is under nano-unlock/, and the main file is there.
          if unzip -Z1 nano-unlock.zip | grep -v '^nano-unlock/'; then echo "files outside nano-unlock/" >&2; exit 1; fi
          unzip -Z1 nano-unlock.zip | grep -qx 'nano-unlock/nano-unlock.php'

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Nano Unlock $GITHUB_REF_NAME" --notes "Install: Plugins → Add New → Upload Plugin → nano-unlock.zip."
          gh release upload "$GITHUB_REF_NAME" nano-unlock.zip --clobber
